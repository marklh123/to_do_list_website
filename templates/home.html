<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <style>
      body {
        background-color: coral;
      }
      .container {
        h1 {
          font-weight: bold;
          color: white;
          font-size: xx-large;
        }

        display: flex;
        flex-direction: column; /* Stacks text/images vertically */
        justify-content: center; /* Centers vertically */
        align-items: center; /* Centers horizontally */
        height: 100vh; /* Makes container full screen height */
      }
      .content {
        font-weight: bold;
        color: white;
        font-size: x-large;
        transform: translateY(-110px);
      }
      .login button {
        border-width: medium;
        border-color: white;
        background-color: coral;
        color: slategray;
        transform: translateX(-70px) translateY(-100px);
        padding: 10px 20px; /* 10px top/bottom, 20px left/right */
        font-size: 16px;
      }

      .sign button {
        border-width: medium;
        border-color: white;
        background-color: coral;
        color: slategray;
        transform: translateX(70px) translateY(-144px);
        padding: 10px 20px; /* 10px top/bottom, 20px left/right */
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Marks To Do List</h1>
      <img src="static/todo.png" />
      <div class="content">
        <p>Welcome, let's get things done</p>
      </div>
      <div class="login button">
        <a href="login">
          <button>Login</button>
        </a>
      </div>
      <div class="sign button">
        <a href="sign_up">
          <button>Sign Up</button>
        </a>
      </div>
    </div>
  </body>
</html>
